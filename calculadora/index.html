<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baticalculator</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/index.js"></script>
</head>

<body>
    <div class="fondo">
        <img src="./img/batmanyrobin66.webp" alt="">
    </div>

    <div class="calculadora">
        <div class="marca">
            Baticalculadora
        </div>

        <div class="pantalla">
            <div class="resultado">0</div>
        </div>

        <div class="teclado">
            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="numero">0</button>
            <button class="numero">00</button>
            <button class="numero">.</button>
            <button class="igual">=</button>
            <button class="limpiar">C</button>
        </div>

        <div class="operador">
            <button class="suma">+</button>
            <button class="resta">-</button>
            <button class="multiplicacion">*</button>
            <button class="division">/</button>
        </div>

    </div>

</body>

</html>
