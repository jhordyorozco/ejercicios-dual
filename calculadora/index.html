<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baticalculator</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/index.js"></script>
</head>

<body>
    <div class="fondo">
        <img src="./img/batmanyrobin66.webp" alt="">
    </div>

    <section class="calculadora">
        <div class="marca">
            Baticalculadora
        </div>

        <div class="pantalla">
            <input type="text" class="resultado">
        </div>

        <div class="teclado">
            <button class="1">1</button>
            <button class="2">2</button>
            <button class="3">3</button>
            <button class="4">4</button>
            <button class="5">5</button>
            <button class="6">6</button>
            <button class="7">7</button>
            <button class="8">8</button>
            <button class="9">9</button>
            <button class="0">0</button>
            <button class="00">00</button>
            <button class="decimal">.</button>
            <button class="igual">=</button>
            <button class="limpiar">C</button>
        </div>

        <div class="operador">
            <button class="suma">+</button>
            <button class="resta">-</button>
            <button class="multiplicacion">*</button>
            <button class="division">/</button>
        </div>
    </section>

</body>

</html>
