<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Desempleo masculino registrado por mes - Illes Balears</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 20px;
        }

        #chart-container {
            position: relative;
            width: 100%;
            height: 480px;
        }
    </style>
</head>

<body>

    <h1>Parados registrados (masculino) por mes - una línea por año</h1>

    <div id="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script>

        // Paleta fija de colores (se reutiliza si hay más años que colores)
        const paleta = [
            '#2a78d6', '#eb6834', '#1baf7a', '#eda100',
            '#e87ba4', '#008300', '#6250d6', '#e34948'
        ];

        const nombresMeses = {
            '01': 'Ene', '02': 'Feb', '03': 'Mar', '04': 'Abr',
            '05': 'May', '06': 'Jun', '07': 'Jul', '08': 'Ago',
            '09': 'Sep', '10': 'Oct', '11': 'Nov', '12': 'Dic'
        };

        // Array explícito y ordenado: NO usar Object.keys(nombresMeses) para esto,
        // porque JS reordena las claves '10','11','12' como índices numéricos
        // ANTES que '01'-'09', y el eje X terminaría empezando en octubre.
        const ordenMeses = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];

        fetch('./total.json')
            .then(response => response.json())
            .then(data => {

                // Solo nos interesan los registros mensuales (tienen "año" y "mes")
                const mensuales = data.filter(d => d.año !== undefined && d.mes !== undefined);

                // Agrupamos por año: { '2024': { '01': 12345, '02': ... }, ... }
                const porAnio = {};
                mensuales.forEach(d => {
                    if (!porAnio[d.año]) porAnio[d.año] = {};
                    porAnio[d.año][d.mes] = d.cantidad;
                });

                const anios = Object.keys(porAnio).sort();

                // Eje X: los 12 meses, empezando en enero
                const labels = ordenMeses.map(m => nombresMeses[m]);

                // Un dataset (línea) por año
                const datasets = anios.map((anio, i) => {
                    const color = paleta[i % paleta.length];
                    return {
                        label: anio,
                        data: ordenMeses.map(mes => porAnio[anio][mes] ?? null), // null si falta ese mes
                        borderColor: color,
                        backgroundColor: color,
                        borderWidth: 2,
                        pointRadius: 3,
                        fill: false,
                        tension: 0.2,
                        spanGaps: true
                    };
                });

                new Chart(document.getElementById('myChart'), {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'right' }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: 'Mes' }
                            },
                            y: {
                                title: { display: true, text: 'Parados registrados' },
                                beginAtZero: true
                            }
                        }
                    }
                });
            })
            .catch(err => console.error('Error cargando total.json:', err));

    </script>

</body>

</html>
